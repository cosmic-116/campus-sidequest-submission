535" y="1085" class="card" text-anchor="middle">1</text><text x="1835" y="1085" class="card" text-anchor="middle">0..N</text><path class="edge" d="M 760 505 V 600 H 540 V 910 M 540 998 V 1100 H 330"/><path class="relation" d="M 540 910 L 628 954 L 540 998 L 452 954 Z"/><text x="540" y="961" text-anchor="middle" font-size="20">escrows</text><text x="734" y="555" class="card" text-anchor="middle">1</text><text x="376" y="1080" class="card" text-anchor="middle">1</text><path class="edge" d="M 1390 505 V 741 M 1390 829 V 1065"/><path class="relation" d="M 1390 741 L 1478 785 L 1390 829 L 1302 785 Z"/><text x="1390" y="792" text-anchor="middle" font-size="20">opens</text><text x="1364" y="542" class="card" text-anchor="middle">1</text><text x="1355" y="1045" class="card" text-anchor="middle">1</text><path class="edge" d="M 1390 435 V 275 H 1836 M 2012 275 H 2540 V 435"/><path class="relation" d="M 1924 231 L 2012 275 L 1924 319 L 1836 275 Z"/><text x="1924" y="282" text-anchor="middle" font-size="20">approves</text><text x="1430" y="407" class="card" text-anchor="middle">1</text><text x="2490" y="407" class="card" text-anchor="middle">0..1</text><path class="edge" d="M 850 505 V 600 H 1120 V 1570 M 1120 1658 V 1750 H 910"/><path class="relation" d="M 1120 1570 L 1208 1614 L 1120 1658 L 1032 1614 Z"/><text x="1120" y="1621" text-anchor="middle" font-size="20">has dispute</text><text x="880" y="555" class="card" text-anchor="middle">1</text><text x="968" y="1735" class="card" text-anchor="middle">0..1</text><path class="edge" d="M 160 1135 V 1334 M 160 1422 V 1605"/><path class="relation" d="M 160 1334 L 248 1378 L 160 1422 L 72 1378 Z"/><text x="160" y="1385" text-anchor="middle" font-size="20">from</text><text x="119" y="1180" class="card" text-anchor="middle">1</text><text x="116" y="1574" class="card" text-anchor="middle">N</text><path class="edge" d="M 280 1135 H 560 V 1334 M 560 1422 V 1640 H 330"/><path class="relation" d="M 560 1334 L 648 1378 L 560 1422 L 472 1378 Z"/><text x="560" y="1385" text-anchor="middle" font-size="20">to</text><text x="360" y="1157" class="card" text-anchor="middle">1</text><text x="512" y="1615" class="card" text-anchor="middle">N</text><rect class="entity" x="110" y="435" width="220" height="70" rx="2"/><text x="220" y="478" font-size="24" text-anchor="middle">app_user</text><path class="edge" d="M 306 435 L 371 398"/><ellipse class="key" cx="382" cy="382" rx="108" ry="25"/><text x="382" y="389" font-size="19" text-anchor="middle" text-decoration="underline">user_id</text><rect class="entity" x="110" y="205" width="220" height="70" rx="2"/><text x="220" y="248" font-size="24" text-anchor="middle">skill</text><path class="edge" d="M 306 205 L 371 168"/><ellipse class="key" cx="382" cy="152" rx="108" ry="25"/><text x="382" y="159" font-size="19" text-anchor="middle" text-decoration="underline">skill_id</text><rect class="entity" x="690" y="205" width="220" height="70" rx="2"/><text x="800" y="248" font-size="24" text-anchor="middle">category</text><path class="edge" d="M 886 205 L 951 168"/><ellipse class="key" cx="962" cy="152" rx="108" ry="25"/><text x="962" y="159" font-size="19" text-anchor="middle" text-decoration="underline">category_id</text><rect class="entity" x="690" y="435" width="220" height="70" rx="2"/><text x="800" y="478" font-size="24" text-anchor="middle">quest</text><path class="edge" d="M 886 435 L 951 398"/><ellipse class="key" cx="962" cy="382" rx="108" ry="25"/><text x="962" y="389" font-size="19" text-anchor="middle" text-decoration="underline">quest_id</text><rect class="entity" x="1280" y="435" width="220" height="70" rx="2"/><text x="1390" y="478" font-size="24" text-anchor="middle">claim</text><path class="edge" d="M 1476 435 L 1541 398"/><ellipse class="key" cx="1552" cy="382" rx="108" ry="25"/><text x="1552" y="389" font-size="19" text-anchor="middle" text-decoration="underline">claim_id</text><rect class="entity" x="1870" y="435" width="220" height="70" rx="2"/><text x="1980" y="478" font-size="24" text-anchor="middle">submission</text><path class="edge" d="M 2066 435 L 2131 398"/><ellipse class="key" cx="2142" cy="382" rx="108" ry="25"/><text x="2142" y="389" font-size="19" text-anchor="middle" text-decoration="underline">submission_id</text><rect class="entity" x="2430" y="435" width="220" height="70" rx="2"/><text x="2540" y="478" font-size="24" text-anchor="middle">approval</text><path class="edge" d="M 2626 435 L 2691 398"/><ellipse class="key" cx="2702" cy="382" rx="108" ry="25"/><text x="2702" y="389" font-size="19" text-anchor="middle" text-decoration="underline">claim_id</text><rect class="entity" x="2430" y="975" width="220" height="70" rx="2"/><text x="2540" y="1018" font-size="24" text-anchor="middle">rating</text><path class="edge" d="M 2626 975 L 2691 938"/><ellipse class="key" cx="2702" cy="922" rx="108" ry="25"/><text x="2702" y="929" font-size="19" text-anchor="middle" text-decoration="underline">claim_id</text><rect class="entity" x="110" y="1065" width="220" height="70" rx="2"/><text x="220" y="1108" font-size="24" text-anchor="middle">point_account</text><path class="edge" d="M 306 1065 L 371 1028"/><ellipse class="key" cx="382" cy="1012" rx="108" ry="25"/><text x="382" y="1019" font-size="19" text-anchor="middle" text-decoration="underline">account_id</text><rect class="entity" x="110" y="1605" width="220" height="70" rx="2"/><text x="220" y="1648" font-size="24" text-anchor="middle">point_transfer</text><path class="edge" d="M 306 1605 L 371 1568"/><ellipse class="key" cx="382" cy="1552" rx="108" ry="25"/><text x="382" y="1559" font-size="19" text-anchor="middle" text-decoration="underline">transfer_id</text><rect class="entity" x="690" y="1065" width="220" height="70" rx="2"/><text x="800" y="1108" font-size="24" text-anchor="middle">quest_comment</text><path class="edge" d="M 886 1065 L 951 1028"/><ellipse class="key" cx="962" cy="1012" rx="108" ry="25"/><text x="962" y="1019" font-size="19" text-anchor="middle" text-decoration="underline">comment_id</text><rect class="entity" x="690" y="1715" width="220" height="70" rx="2"/><text x="800" y="1758" font-size="24" text-anchor="middle">dispute</text><path class="edge" d="M 886 1715 L 951 1678"/><ellipse class="key" cx="962" cy="1662" rx="108" ry="25"/><text x="962" y="1669" font-size="19" text-anchor="middle" text-decoration="underline">dispute_id</text><rect class="entity" x="1280" y="1065" width="220" height="70" rx="2"/><text x="1390" y="1108" font-size="24" text-anchor="middle">conversation</text><path class="edge" d="M 1476 1065 L 1541 1028"/><ellipse class="key" cx="1552" cy="1012" rx="108" ry="25"/><text x="1552" y="1019" font-size="19" text-anchor="middle" text-decoration="underline">conversation_id</text><rect class="entity" x="1870" y="1065" width="220" height="70" rx="2"/><text x="1980" y="1108" font-size="24" text-anchor="middle">chat_message</text><path class="edge" d="M 2066 1065 L 2131 1028"/><ellipse class="key" cx="2142" cy="1012" rx="108" ry="25"/><text x="2142" y="1019" font-size="19" text-anchor="middle" text-decoration="underline">message_id</text><text x="1700" y="1380" font-size="30">Reading this diagram</text><text x="1700" y="1425" class="small">Lavender rectangles = conceptual entities</text><text x="1700" y="1460" class="small">Peach diamonds = relationships; green ovals = keys</text><text x="1700" y="1495" class="small">1 / N / 0..1 describe allowed multiplicity</text><text x="1700" y="1550" class="small">The has-skills diamond maps to user_skill:</text><text x="1700" y="1585" class="small">PRIMARY KEY (user_id, skill_id), two foreign keys.</text><text x="1700" y="1640" class="small">A conversation is created with every lifetime claim.</text><text x="1700" y="1675" class="small">USER accounts belong only to students; admins have none.</text><text x="1700" y="1710" class="small">ESCROW ownership is conditional on account kind.</text><text x="80" y="1900" font-size="28">Additional actor roles (one app_user entity, several foreign keys)</text><text x="80" y="1943" class="small">helper → claim · sender → chat_message · author → quest_comment · raised_by / assigned_admin → dispute</text><text x="80" y="1978" class="small">Each role is 1 user to 0..N records; assigned_admin is optional until assignment. Participant/admin checks also use routines.</text><text x="80" y="2013" class="small">These role edges are listed here to keep the main paths readable. All 22 physical FKs and every field are in RELATIONAL_SCHEMA.md.</text><text x="80" y="2070" class="small">Shared keys: approval.claim_id → claim; rating.claim_id → approval. The composite approval/submission FK prevents cross-claim approval.</text></svg>