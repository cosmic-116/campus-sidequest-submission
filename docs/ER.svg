<svg xmlns="http://www.w3.org/2000/svg" width="2900" height="2140" viewBox="0 0 2900 2140"><rect width="2900" height="2140" fill="#faf6e9"/><style>text{font-family:Georgia,serif;fill:#342944}.entity{fill:#e5d9f3;stroke:#716080;stroke-width:2}.key{fill:#dfedcf;stroke:#7d9272;stroke-width:1.6}.relation{fill:#f5dcc7;stroke:#a98466;stroke-width:1.8}.edge{fill:none;stroke:#837889;stroke-width:2}.card{font:20px Arial,sans-serif;fill:#63576a;paint-order:stroke;stroke:#faf6e9;stroke-width:7px;stroke-linejoin:round}.small{font:20px Arial,sans-serif;fill:#625a66}</style><text x="80" y="65" font-size="36">Campus SideQuest · conceptual ER diagram</text><text x="80" y="100" class="small">14 conceptual entities + the student–skill M:N bridge = 15 MySQL business tables</text><path class="edge" d="M 220 275 V 311 M 220 399 V 435"/><path class="relation" d="M 220 311 L 308 355 L 220 399 L 132 355 Z"/><text x="220" y="362" text-anchor="middle" font-size="20">has skills</text><text x="194" y="312" class="card" text-anchor="middle">M</text><text x="185" y="415" class="card" text-anchor="middle">N</text><path class="edge" d="M 800 275 V 311 M 800 399 V 435"/><path class="relation" d="M 800 311 L 888 355 L 800 399 L 712 355 Z"/><text x="800" y="362" text-anchor="middle" font-size="20">groups</text><text x="774" y="312" class="card" text-anchor="middle">1</text><text x="765" y="415" class="card" text-anchor="middle">N</text><path class="edge" d="M 330 470 H 422 M 598 470 H 690"/><path class="relation" d="M 510 426 L 598 470 L 510 514 L 422 470 Z"/><text x="510" y="477" text-anchor="middle" font-size="20">posts</text><text x="365" y="455" class="card" text-anchor="middle">1</text><text x="655" y="455" class="card" text-anchor="middle">N</text><path class="edge" d="M 910 470 H 1007 M 1183 470 H 1280"/><path class="relation" d="M 1095 426 L 1183 470 L 1095 514 L 1007 470 Z"/><text x="1095" y="477" text-anchor="middle" font-size="20">has claim</text><text x="945" y="455" class="card" text-anc